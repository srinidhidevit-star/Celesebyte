<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Celesebyte</title>
    <link rel="stylesheet" href="../static/css/common.css">
    <link rel="stylesheet" href="../static/css/contact.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" >
</head>
<body>
     <!-- Common Navbar -->
    <div id="navbar"></div>
    <section class="contact-sec1">
        <div class="get-in-touch">
            <div class="contact-content">
                <div class="touch">
                    <i class="bi bi-stars"></i>
                    <h6>Get in touch</h6>
                </div>  
                <h1>Contact Us</h1>
                <p>Have a project in mind or a question? We work remotely across <br>India and on-site in Visakhapatnam — we'd love to hear from you.</p>
            </div>
            <div class="contact-image">
                <img src="https://bluerang.in/img/contact.svg" alt="contact-image" height="500vh">
            </div>
        </div>
    </section>
    <section class="contact-sec2">
        <div class="mail-contact">
            <div class="contact-grid">
                <div class="contact-icon">
                    <i class="bi bi-award"></i>
                </div>
                <h2>Email us</h2>
                <a class="grid-mail">abc@gmail.com</a>
            </div>
        </div>
    </section>
    <!-- Common Footer -->
    <div id="footer"></div>
    <script src="../static/js/common.js"></script>
</body>
</html>
